[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.199.0",
    "ollama>=0.6.2",
    "python-dotenv>=1.2.3",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
backend = "app.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = "src/backend"
